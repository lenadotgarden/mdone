name: Build check

# Compilation rapide iOS + macOS sur chaque push de branche, sans tests.
# C'est la boucle de feedback principale (pas de compilateur Swift local).
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-layering.sh
      - name: Things strings have a French translation
        run: python3 scripts/check-things-localization.py
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: mDone
            destination: generic/platform=iOS Simulator
          - name: macOS
            scheme: mDone-macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project mDone.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build-for-testing 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|\*\* " || true
          grep -q "BUILD SUCCEEDED\|TEST BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60
  domain-tests:
    name: Domain tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen && xcodegen generate
      - name: Run Domain tests
        run: |
          set -o pipefail
          xcodebuild -project mDone.xcodeproj -scheme mDone-macOS -destination 'platform=macOS' \
            -only-testing:mDoneMacTests/ThingsListBuilderTests -only-testing:mDoneMacTests/ThingsMappingTests -only-testing:mDoneMacTests/ThingsRowMapperTests -only-testing:mDoneMacTests/ThingsShortcutTableTests -only-testing:mDoneMacTests/ThingsQuickFindEngineTests -only-testing:mDoneMacTests/ThingsProjectTreeTests -only-testing:mDoneMacTests/ThingsReorderTests -only-testing:mDoneMacTests/ThingsNaturalLanguageTests -only-testing:mDoneMacTests/ThingsQuickFindGroupingTests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS=mDone/mDone-macOS-CI.entitlements \
            test 2>&1 | tee test.log | grep -E "error:|Test Case.*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log
